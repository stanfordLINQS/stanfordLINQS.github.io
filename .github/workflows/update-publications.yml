name: Update publications

on:
  schedule:
    - cron: "17 11 * * *" # daily, ~4am Pacific
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate publications from Google Scholar
        run: python scripts/update-publications.py --verbose

      - name: Commit changes
        run: |
          git add assets/js/publications-data.js scripts/publications-cache.json
          if git diff --cached --quiet; then
            echo "Publications unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update publications from Google Scholar."
          git push
